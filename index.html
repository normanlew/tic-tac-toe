<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <script src="javascript.js" defer></script>
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <body>
        <div class="container">
            <div class="top-display">
                <div class="game-board">
                    <div class="square" id="zero">
                    </div>
                    <div class="square" id="one">
                    </div>
                    <div class="square" id="two">
                    </div>
                    <div class="square" id="three">
                    </div>
                    <div class="square" id="four">
                    </div>
                    <div class="square" id="five">
                    </div>
                    <div class="square" id="six">
                    </div>
                    <div class="square" id="seven">
                    </div>
                    <div class="square" id="eight">
                    </div>
                </div>
            </div>

            <div class="announcements">
                <div class="game-reset">
                    <button id="new-game">New Game</button>
                </div>

                <div class="game-announcements">
                </div>
            </div>

        </div>

    </body>
</html>
