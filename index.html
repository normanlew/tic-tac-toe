<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <script src="javascript.js" defer></script>
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <body>
        <div class="container">
            <div class="top-display">
                <div class="game-board">
                    <div class="square" id="0">
                        <svg height="140" width="140" xmlns="http://www.w3.org/2000/svg">
                        <line x1="20" y1="20" x2="120" y2="120" style="stroke:blue;stroke-width:12" />
                        <line x1="20" y1="120" x2="120" y2="20" style="stroke:blue;stroke-width:12" />
                        </svg>
     
                    </div>
                    <div class="square" id="1">
                        <svg height="140" width="140" xmlns="http://www.w3.org/2000/svg">
                        <circle class="svg-circle" cx="70" cy="70" r="60"/>
                        </svg>
                    </div>
                    <div class="square" id="2">
                    </div>
                    <div class="square" id="3">
                    </div>
                    <div class="square" id="4">
                    </div>
                    <div class="square" id="5">
                    </div>
                    <div class="square" id="6">
                    </div>
                    <div class="square" id="7">
                    </div>
                    <div class="square" id="8">
                    </div>
                </div>
            </div>

            <div class="announcements">
                <p>This is the announcements</p>
            </div>

        </div>

    </body>
</html>
